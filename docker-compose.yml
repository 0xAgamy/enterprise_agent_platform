services:
  
  qdrant:
    image: qdrant/qdrant
    ports:
      - 6333:6333
      - 6334:6334
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: unless-stopped


  postgress:
    image: postgres:16-alpine
    ports:
      - 5433:5432
    env_file:
        - .env.postgres
    restart: unless-stopped
    volumes:
      - ./postgress_data:/var/lib/postgresql/data